name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build_setup

      - name: Resolve version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          version="${version%%-*}"
          IFS='.' read -r major minor patch <<< "$version"
          if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ || ! "$patch" =~ ^[0-9]+$ ]]; then
            echo "Tag '$TAG' is not a valid release tag (expected vX.Y.Z)." >&2
            exit 1
          fi
          version_code="$((major + 28))$(printf '%02d' "$minor")$(printf '%03d' "$patch")"
          echo "version_name=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build unsigned release APKs
        run: |
          ./gradlew :app:assembleFreeRelease \
            -Pvoice.versionName="${{ steps.version.outputs.version_name }}" \
            -Pvoice.versionCode="${{ steps.version.outputs.version_code }}"
          mkdir -p artifacts
          cp app/build/outputs/apk/free/release/*.apk artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.apk
